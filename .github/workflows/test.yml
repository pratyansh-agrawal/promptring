name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 18
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Check Node CLI
        run: node --check npm-cli.js

      - name: Run unit tests
        run: python tests/test_core.py

      - name: Run Unix smoke tests
        if: runner.os != 'Windows'
        run: bash tests/smoke.sh

      - name: Run Windows smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/smoke.ps1

      - name: Validate npm package
        if: runner.os == 'Linux'
        run: |
          node scripts/prepare-npm-package.mjs
          npm pack .npm-package --dry-run --ignore-scripts
